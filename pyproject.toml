[project]
name = "botc-scad-generator"
version = "0.2.0"
description = "Generate OpenSCAD/STL character and reminder tokens for Blood on the Clocktower."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13",
    "numpy>=1.26",
    "pillow>=10.0",
    # Pure-Python potrace. Replaces the ImageMagick + potrace binaries, which
    # were the main thing stopping this project running on Windows.
    "potracer>=0.0.4",
    "requests>=2.32",
    "solidpython>=1.1.3",
    # Fast, robust mesh boolean used to recess the disc so the coloured inlay
    # sits flush. Ships prebuilt wheels (incl. Windows) and only needs numpy.
    "manifold3d>=3.0",
    # Writes the Excel print-tracking checklist (make_print_checklist.py).
    "openpyxl>=3.1",
    # solidpython 1.1.3 does `import pkg_resources` at import time but does not
    # declare setuptools (which provides pkg_resources) as a dependency. A clean
    # uv venv omits setuptools, so without this the very first
    # `from solid import ...` fails with ModuleNotFoundError. The upper bound
    # matters: setuptools 81 removed pkg_resources, so a newer pin reintroduces
    # the same error. This range keeps pkg_resources available.
    "setuptools>=68,<81",
]

[dependency-groups]
dev = [
    "lxml>=6.1.3",
    "networkx>=3.4.2",
    "pytest>=8.0",
    "ruff>=0.6",
    "trimesh>=5.1.1",
]

[tool.uv]
# A flat collection of scripts, not an installable library, so do not try to
# build and install the project itself into the venv.
package = false

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".github",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "dist",
    "node_modules",
    "venv",
    "scads",
    "stls",
]

[tool.ruff.lint]
# `select` moved under [tool.ruff.lint] in ruff 0.2; the old top-level form is
# deprecated and warns on every run.
select = ["E", "F", "B"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# solid_maker.py lives at the repo root, not in an installed package, so put the
# root on sys.path for imports. Needed under `uv run`, where the project is not
# pip-installed (package = false).
pythonpath = ["."]
filterwarnings = [
    # solidpython imports the deprecated pkg_resources; not our code, just noise.
    "ignore:pkg_resources is deprecated:UserWarning",
]
